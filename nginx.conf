server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https:; frame-src https://www.youtube.com https://youtube.com; frame-ancestors 'none';" always;
    # HSTS só tem efeito quando servido via HTTPS (ex.: atrás do proxy reverso do Passo 4 do DEPLOY.md); navegadores ignoram o header em respostas HTTP puras.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Bloquear acesso a arquivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Serve static files directly
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets (CSS, JS, images, fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Cache web fonts
    location ~* \.(?:ttf|ttc|otf|eot|woff|woff2)$ {
        expires 3M;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
    }

    # Custom 404 page (redirect to index or handle elegantly)
    error_page 404 /index.html;
}
