<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https:; frame-ancestors 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstruturaPRO — Plataforma de Ensino de Estrutura de Dados</title>
  <meta name="description" content="Plataforma interativa de ensino de Estrutura de Dados com visualizações animadas, exercícios e painel do professor." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-page">

  <!-- Background Elements -->
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>

  <!-- Login Container -->
  <div class="login-container">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-name">EstruturaPRO</div>
      <div class="brand-tagline">Aprenda Estrutura de Dados de forma visual e interativa</div>
    </div>

    <!-- Card -->
    <div id="login-card" class="card">

      <!-- Role Selector Tabs -->
      <div class="role-tabs" role="tablist" aria-label="Selecionar perfil">
        <button class="role-tab active" data-role="student" id="tab-student" role="tab">
          <span class="tab-icon">🎓</span> Sou Aluno
        </button>
        <button class="role-tab" data-role="teacher" id="tab-teacher" role="tab">
          <span class="tab-icon">👨‍🏫</span> Sou Professor
        </button>
      </div>

      <!-- Form Header -->
      <h1 class="form-title">Bem-vindo de volta!</h1>
      <p class="form-subtitle">Entre com suas credenciais para acessar a plataforma.</p>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div class="form-fields">

          <div class="input-group">
            <label for="email" class="input-label">E-mail</label>
            <div class="input-icon-wrap">
              <span class="icon">📧</span>
              <input
                type="email"
                id="email"
                class="input-field"
                placeholder="seu@email.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password" class="input-label">Senha</label>
            <div class="input-icon-wrap">
              <span class="icon">🔒</span>
              <input
                type="password"
                id="password"
                class="input-field"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

        </div>

        <p class="error-msg" id="error-msg" role="alert"></p>

        <button type="submit" id="btn-login" class="btn btn-primary btn-lg">
          Entrar na Plataforma
        </button>
      </form>
    </div>

    <!-- Features -->
    <div class="features-hint">
      <div class="feature-item">
        <span class="feature-icon">🎯</span>
        <span>6 módulos interativos</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">🎞️</span>
        <span>Visualizações animadas</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">📊</span>
        <span>Painel do professor</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">🏆</span>
        <span>Sistema de progresso</span>
      </div>
    </div>

  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Supabase SDK & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <!-- js/data.js é immutable/cacheado por 30 dias (vercel.json), e um cache de borda da
       CDN não invalida automaticamente em deploy novo. Incrementar este número sempre que
       js/data.js mudar (mesmo padrão de js/ide-worker.js). -->
  <script src="js/data.js?v=3"></script>
  <script src="js/auth.js"></script>
</body>
</html>
